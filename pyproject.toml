[project]
name = "mpspulse"
version = "0.1.0"
description = "Apple Silicon PyTorch MPS profiling and training ETA"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mps = ["torch>=2.6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
mpspulse = "mpspulse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mpspulse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
markers = [
    "mps: requires Apple Silicon MPS",
    "slow: long benchmarks",
]
